<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Growth Compounders</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            padding: 20px;
            width: 100%;
            max-width: 400px;
        }

        .logo {
            width: 100%;
            max-width: 320px;
            height: auto;
            margin-bottom: 30px;
        }

        .telegram-button {
            display: inline-block;
            width: 100%;
            max-width: 300px;
            padding: 17px 20px;
            background-color: #1557c0;
            color: white;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
            border-radius: 10px;
            transition: 0.3s;
        }

        .telegram-button:hover {
            background-color: #1048a4;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Your Logo -->
        <img
            src="assets/logo.jpg"
            alt="Growth Compounders Logo"
            class="logo"
        >

        <!-- Telegram Group Button -->
        <a
            href="https://t.me/GrowthCompounders"
            class="telegram-button"
            target="_blank"
            rel="noopener noreferrer"
        >
            Open Telegram Group
        </a>

    </div>

</body>
</html>
